- name: onepassword | package repository
  ansible.builtin.deb822_repository:
    name: 1password
    types: deb
    uris: "{{ onepassword_repo_url }}"
    suites: stable
    components: main
    architectures: amd64
    signed_by: "{{ onepassword_repo_key }}"
  become: true

- name: onepassword | package
  ansible.builtin.apt:
    update_cache: true
    pkg: "{{ onepassword_cli_package }}"
  become: true
