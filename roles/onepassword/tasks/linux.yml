- name: onepassword | python-debian dependency
  ansible.builtin.apt:
    name: python3-debian
    state: present
  become: true

- name: onepassword | package repository
  ansible.builtin.deb822_repository:
    name: 1password
    types: deb
    uris: "{{ onepassword_repo_url }}"
    suites: stable
    components: main
    architectures: "{{ onepassword_deb_arch }}"
    signed_by: "{{ onepassword_repo_key }}"
  become: true

- name: onepassword | package
  ansible.builtin.apt:
    update_cache: true
    # The 1Password GUI app isn't published for arm64, only the CLI.
    pkg: >-
      {{ [onepassword_cli_package] +
         ([onepassword_gui_package] if onepassword_deb_arch == 'amd64' else []) }}
  become: true
