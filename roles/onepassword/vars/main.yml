---
onepassword_tap: 1password/tap
onepassword_gui_package: 1password
onepassword_cli_package: 1password-cli
onepassword_repo_key: https://downloads.1password.com/linux/keys/1password.asc
onepassword_arch_map:
  x86_64: amd64
  aarch64: arm64
onepassword_deb_arch: "{{ onepassword_arch_map[ansible_architecture] }}"
onepassword_repo_url: "https://downloads.1password.com/linux/debian/{{ onepassword_deb_arch }}"
